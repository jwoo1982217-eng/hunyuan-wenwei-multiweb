plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.wenwei.deepseekproxy'
    compileSdk 36

    defaultConfig {
        applicationId 'com.wenwei.deepseekproxy.multiweb'
        minSdk 21
        targetSdk 35
        versionCode 29
        versionName '1.0.29-H3照片动画'
        ndk { abiFilters 'arm64-v8a' }
    }

    buildFeatures { compose true }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // 不用混淆（客户交付要求）
            // Keep the handoff APK directly installable and update-compatible with
            // the debug-signed builds used on the physical test device.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'androidx.media3:media3-common:1.3.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0'

    implementation platform('androidx.compose:compose-bom:2025.05.01')
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'io.ktor:ktor-server-cio-jvm:3.1.3'
    implementation 'io.ktor:ktor-server-core-jvm:3.1.3'
    implementation 'io.ktor:ktor-server-content-negotiation-jvm:3.1.3'
    implementation 'io.ktor:ktor-server-cors-jvm:3.1.3'
    implementation 'io.ktor:ktor-serialization-kotlinx-json-jvm:3.1.3'

    testImplementation 'junit:junit:4.13.2'
}
